# RANDOMIZED CONTROLLED TRIALS ONLY
# Restrict to RCTs (exclude observational studies)

name: RCTs Only
description: Meta-analysis restricted to randomized controlled trials
category: sensitivity
author: EvidenceOS Team
version: 1.0
created_date: 2025-11-04

meta_analysis:
  method: REML
  model: random
  measure: auto

inclusion:
  min_sample_size: null
  max_sample_size: null
  exclude_high_rob: false
  min_year: null
  max_year: null

  # Study design filter - KEY DIFFERENCE
  allowed_designs: [RCT, randomized, randomised]

subgroup:
  enabled: false
  variable: null

meta_regression:
  enabled: false
  moderators: []

publication_bias:
  egger_test: true
  trim_and_fill: true

reporting:
  forest_plot: true
  funnel_plot: true
  heterogeneity_stats: true
  influence_analysis: false

notes: |
  RCTs provide the highest level of evidence for causality.
  If results differ from base case (which may include observational
  studies), consider whether observational studies are introducing
  bias or confounding.
