# LARGE STUDIES ONLY
# Restrict to studies with n >= 100 per arm

name: Large Studies Only
description: Meta-analysis restricted to large studies (n >= 100 per arm)
category: sensitivity
author: EvidenceOS Team
version: 1.0
created_date: 2025-11-04

meta_analysis:
  method: REML
  model: random
  measure: auto

inclusion:
  # Sample size filter - KEY DIFFERENCE
  min_sample_size: 100
  max_sample_size: null

  exclude_high_rob: false
  min_year: null
  max_year: null
  allowed_designs: null

subgroup:
  enabled: false
  variable: null

meta_regression:
  enabled: false
  moderators: []

publication_bias:
  egger_test: true
  trim_and_fill: true

reporting:
  forest_plot: true
  funnel_plot: true
  heterogeneity_stats: true
  influence_analysis: true

notes: |
  This scenario assesses whether small-study effects are driving
  the results. Large studies are less susceptible to publication
  bias and reporting bias.
