[pytest]
# Pytest Configuration for EvidenceOS Backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --cov=ml
    --cov=api
    --cov=cache
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-config=.coveragerc
    -p no:warnings

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    slow: Tests that take significant time to run
    requires_redis: Tests that require Redis to be running
    requires_shap: Tests that require SHAP library
    requires_lime: Tests that require LIME library
    requires_ml: Tests that require ML libraries (XGBoost, LightGBM, etc.)

# Coverage options
[coverage:run]
source = ml, api, cache
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
