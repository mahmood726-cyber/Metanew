# Pre-commit hooks configuration for EvidenceOS PRIME
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(md|rst)$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-docstring-first
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: name-tests-test
        args: ['--pytest-test-first']
      - id: requirements-txt-fixer

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.10
        files: ^backend/
        exclude: ^backend/migrations/

  # Import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^backend/
        exclude: ^backend/migrations/

  # Linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=100
          - --extend-ignore=E203,W503,E501
          - --exclude=migrations
        files: ^backend/
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args:
          - --ignore-missing-imports
          - --no-strict-optional
          - --warn-redundant-casts
          - --warn-unused-ignores
        files: ^backend/
        exclude: ^backend/migrations/
        additional_dependencies:
          - types-redis
          - types-requests

  # Security linting with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args:
          - -r
          - backend/
          - -ll  # Only report medium and high severity issues
          - --exclude
          - backend/migrations/,backend/tests/
        files: ^backend/

  # Pylint for additional checks
  - repo: https://github.com/pycqa/pylint
    rev: v3.0.3
    hooks:
      - id: pylint
        args:
          - --max-line-length=100
          - --disable=C0111,R0903,C0103
        files: ^backend/
        exclude: ^backend/migrations/|^backend/tests/

  # Check for secrets/credentials
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--fix']
        exclude: ^(CHANGELOG|node_modules|venv)/

  # Check Python docstrings
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args:
          - --convention=google
          - --add-ignore=D100,D101,D102,D103,D104,D105,D107
        files: ^backend/
        exclude: ^backend/migrations/|^backend/tests/

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ['--ignore', 'DL3008', '--ignore', 'DL3015']

# Configuration for specific hooks

# CI skip for certain commits
ci:
  skip: [pylint, mypy]  # These are too slow for CI pre-commit

# Local hooks
  - repo: local
    hooks:
      # Run Python tests
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        files: ^backend/tests/
        pass_filenames: false
        args: ['-v', '--tb=short', '--maxfail=3']
        stages: [push]

      # Check for print statements (should use logging)
      - id: check-print-statements
        name: Check for print statements
        entry: 'print\('
        language: pygrep
        files: ^backend/
        exclude: ^backend/tests/|^backend/scripts/
        types: [python]
