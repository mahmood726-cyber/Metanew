# pytest configuration for EvidenceOS PRIME
[pytest]

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests/py tests/integration tests/e2e

# Add backend to Python path
pythonpath = . backend

# Command line options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning
    # Coverage options (when --cov is used)
    --cov-config=.coveragerc
    --cov-branch
    # Show durations of slowest tests
    --durations=10

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    gui: marks tests as GUI tests
    api: marks tests as API tests
    unit: marks tests as unit tests
    property: marks tests as property-based tests
    benchmark: marks tests as performance benchmarks
    security: marks tests as security tests
    smoke: marks tests as smoke tests (quick validation)

# Timeout for tests (in seconds)
timeout = 300
timeout_method = thread

# Coverage options
[coverage:run]
source = backend
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*
    */migrations/*

[coverage:report]
precision = 2
skip_empty = True
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
