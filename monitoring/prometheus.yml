# Prometheus Configuration for EvidenceOS PRIME

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'evidenceos-prod'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # EvidenceOS Backend API
  - job_name: 'evidenceos-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-backend:8000']
        labels:
          service: 'backend'
          component: 'api'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'backend'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'cache'
          component: 'redis'
    # Note: Requires redis_exporter for metrics
    # - job_name: 'redis'
    #   static_configs:
    #     - targets: ['redis-exporter:9121']

  # Node Exporter (if deployed)
  - job_name: 'node'
    static_configs:
      - targets: []
        # - node-exporter:9100

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: []
        # - cadvisor:8080
