# AlertManager Configuration for EvidenceOS PRIME

global:
  resolve_timeout: 5m
  # SMTP Configuration (optional - configure for email alerts)
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alerts@evidenceos.com'
  # smtp_auth_username: 'your-email@gmail.com'
  # smtp_auth_password: 'your-app-password'

  # Slack Configuration (optional)
  # slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

# Templates for alert notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alert delivery
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'

  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts - batched notifications
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 30s
      repeat_interval: 3h

    # ML-specific alerts
    - match:
        component: ml
      receiver: 'ml-team'
      group_wait: 30s

    # Database alerts
    - match:
        component: database
      receiver: 'db-team'
      group_wait: 10s

# Alert receivers configuration
receivers:
  # Default receiver - logs only
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true

  # Critical alerts receiver
  - name: 'critical'
    # Email notifications (uncomment and configure)
    # email_configs:
    #   - to: 'oncall@evidenceos.com'
    #     subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
    #     html: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

    # Slack notifications (uncomment and configure)
    # slack_configs:
    #   - channel: '#alerts-critical'
    #     title: '🚨 CRITICAL Alert'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    #     send_resolved: true

    # PagerDuty integration (uncomment and configure)
    # pagerduty_configs:
    #   - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'

    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true

  # Warning alerts receiver
  - name: 'warning'
    # slack_configs:
    #   - channel: '#alerts-warning'
    #     title: '⚠️ Warning Alert'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    #     send_resolved: true

    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true

  # ML team receiver
  - name: 'ml-team'
    # email_configs:
    #   - to: 'ml-team@evidenceos.com'
    #     subject: 'ML Alert: {{ .GroupLabels.alertname }}'

    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true

  # Database team receiver
  - name: 'db-team'
    # email_configs:
    #   - to: 'db-team@evidenceos.com'
    #     subject: 'Database Alert: {{ .GroupLabels.alertname }}'

    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true

# Inhibition rules - suppress certain alerts when others are firing
inhibit_rules:
  # Suppress warning alerts when critical alerts are firing for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # If service is down, suppress all other alerts for that service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['service']
