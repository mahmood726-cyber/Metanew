apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evidenceos

resources:
  - namespace.yaml
  - rbac.yaml
  - network-policies.yaml
  - configmap.yaml
  # SECURITY: Generate secrets.yaml before deploying
  # Run: ./generate-secrets.sh
  # Note: secrets.yaml is gitignored and must be created locally
  - secrets.yaml
  - pvc.yaml
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - backend-deployment.yaml
  - ingress.yaml

commonLabels:
  app: evidenceos
  managed-by: kustomize
