apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evidenceos-staging

bases:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

replicas:
  - name: evidenceos-backend
    count: 2

images:
  - name: ghcr.io/your-org/evidenceos-backend
    newTag: staging

patches:
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.evidenceos.com
    target:
      kind: Ingress
      name: evidenceos-ingress

configMapGenerator:
  - name: evidenceos-config
    behavior: merge
    literals:
      - LOG_LEVEL=DEBUG
      - ENABLE_DEBUG=true

resources:
  - namespace.yaml

# Staging-specific resources
files:
  - namespace.yaml
