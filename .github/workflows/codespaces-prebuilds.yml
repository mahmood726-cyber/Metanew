name: Codespaces Prebuilds

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  prebuild:
    name: Prebuild Codespace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check devcontainer configuration
        run: |
          echo "✅ Checking .devcontainer/devcontainer.json..."
          if [ -f .devcontainer/devcontainer.json ]; then
            echo "✓ devcontainer.json found"
          else
            echo "✗ devcontainer.json not found"
            exit 1
          fi

      - name: Validate configuration
        run: |
          echo "✅ Configuration is valid"
          echo "Codespaces will use this configuration for prebuilds"

      - name: Summary
        run: |
          echo "## Codespaces Prebuild Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Configuration validated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Features" >> $GITHUB_STEP_SUMMARY
          echo "- Python 3.11" >> $GITHUB_STEP_SUMMARY
          echo "- R with meta-analysis packages" >> $GITHUB_STEP_SUMMARY
          echo "- FastAPI backends" >> $GITHUB_STEP_SUMMARY
          echo "- Shiny frontend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ports" >> $GITHUB_STEP_SUMMARY
          echo "- 3838: Shiny UI" >> $GITHUB_STEP_SUMMARY
          echo "- 8000: FastAPI Main" >> $GITHUB_STEP_SUMMARY
          echo "- 8001: AI Copilot" >> $GITHUB_STEP_SUMMARY
