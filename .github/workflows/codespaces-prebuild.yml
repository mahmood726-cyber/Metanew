name: Codespaces Prebuild

# This workflow creates prebuilt Codespaces environments for faster startup
# Prebuilds are triggered on push to main and can be manually dispatched

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.devcontainer/**'
      - '.github/workflows/codespaces-prebuild.yml'
  workflow_dispatch:
  schedule:
    # Rebuild every Monday at 2am UTC to keep prebuilds fresh
    - cron: '0 2 * * 1'

jobs:
  prebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api
          file: ./backend/api/Dockerfile
          push: false
          tags: evidenceos-ai-backend:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: evidenceos-shiny-frontend:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Move cache to avoid ever-growing cache size
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Test quick-start script
        run: |
          chmod +x quick-start.sh
          # Dry run to check script syntax
          bash -n quick-start.sh

      - name: Summary
        run: |
          echo "✅ Prebuild completed successfully"
          echo "📦 Images built and cached"
          echo "🚀 Codespaces will start much faster!"
