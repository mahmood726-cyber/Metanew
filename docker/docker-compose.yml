version: '3.8'

services:
  evidenceos:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: evidenceos-prime
    ports:
      - "3838:3838"  # Shiny
      - "8000:8000"  # FastAPI
    volumes:
      - ../data:/app/data
      - ../outputs:/app/outputs
      - shiny-logs:/var/log/shiny-server
    environment:
      - API_BASE_URL=http://localhost:8000
      - SHINY_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL for production deployments
  # postgres:
  #   image: postgres:15
  #   container_name: evidenceos-db
  #   environment:
  #     - POSTGRES_DB=evidenceos
  #     - POSTGRES_USER=evidenceos
  #     - POSTGRES_PASSWORD=changeme
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  shiny-logs:
  # postgres-data:

networks:
  default:
    name: evidenceos-network
